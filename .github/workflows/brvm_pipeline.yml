name: BRVM Extraction and Parsing Pipeline

# 1. Déclenchement : Manuel ou via l'API (n8n)
on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 2. Récupérer le code du dépôt GitHub
      - name: Checkout du code
        uses: actions/checkout@v4

      # 3. Configurer l'environnement Python
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

# 4. Installation des dépendances système, Python et Playwright
      - name: Installation des dépendances
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 poppler-utils
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m playwright install --with-deps

      # 5. Exécuter vos scripts d'extraction et parsing
      - name: Exécution des scripts Python
        run: | 
        # 5. Exécution des scripts Python
      - name: Exécution des scripts Python
        run: |
          python download_brvm_report.py
          python parsing_orc.py
      # 6. Publier (Push) le fichier CSV mis à jour sur GitHub
      - name: Commit et Push du fichier CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add brvm_financial_database_clean.csv
          git commit -m "Mise à jour automatique des données BRVM [skip ci]" || exit 0
          git push
